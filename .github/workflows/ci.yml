name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Committed dist matches a fresh build
        run: |
          rm -rf dist
          npm run build
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit dist/."
            git status --short --untracked-files=all -- dist
            git diff --stat -- dist
            exit 1
          fi
          echo "dist/ matches a fresh build"
